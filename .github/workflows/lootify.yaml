name: lootify
on:
  workflow_dispatch
  schedule:
    - chron: 0 7 5 * *
    
jobs:
  lootify:
    container:
      image: python@sha256:cd311c6a0164f34a7edbf364e05258b07d66d3f7bc155139dcb9bef88a186ded
    services:
      hub:
        image: selenium/standalone-chrome:latest

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install pip
        run: pip install -r requirements.txt

      - name: Lootify GAINSBOROUGH
        run: |
          export user=gainsborough pass=${{ secrets.PASSWORD }}
          python3 lootify.py

      - name: Lootify REFIA
        run: |
          export user=refia pass=${{ secrets.PASSWORD }}
          python3 lootify.py

      - name: Lootify TRAMEL
        run: |
          export user=tramel pass=${{ secrets.PASSWORD }}
          python3 lootify.py






