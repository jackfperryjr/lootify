name: lootify
on:
  workflow_dispatch
  # schedule:
  #   - chron: 0 7 5 * *
    
jobs:
  lootify:
    container:
      image: python@sha256:cd311c6a0164f34a7edbf364e05258b07d66d3f7bc155139dcb9bef88a186ded
    services:
      - name: selenium/standalone-chrome:latest
        alias: hub

    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        
      - name: pip install
        run: pip install -r requirements.txt

      - name: lootify account:gainsborough
        run: |
          export user=${{ secrets.GAINSBOROUGH }} pass=${{ secrets.PASSWORD }}
          python3 lootify.py





