name: lootify
on:
  workflow_dispatch:
  schedule:
    # CRON Generator Link: https://crontab.guru
    - cron: "33 3 * * *"

jobs:
  login-account:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - account: ${{ secrets.ACCOUNT }}
            password: ${{ secrets.PASSWORD }}
            game: ${{ secrets.GAME_CODE }}
      fail-fast: false
    name: login ${{ matrix.account }}
    steps:
      - uses: elanthia-online/simu-rewards@v1
        with:
          account: ${{ secrets[matrix.account] }}
          password: ${{ secrets[matrix.password] }}
          game: ${{ secrets[matrix.game] }}
          bypass_login: false
