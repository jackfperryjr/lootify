name: lootify
on:
  workflow_dispatch:
  schedule:
    # CRON Generator Link: https://crontab.guru
    - cron: "33 9 * * *"

jobs:
  account1:
    runs-on: ubuntu-latest
    name: login and lootify account1
    steps:
      - uses: elanthia-online/simu-rewards@v1
        with:
          account: ${{ secrets.ACCOUNT }}
          password: ${{ secrets.PASSWORD }}
          game: ${{ secrets.GAME_CODE }}
          bypass_login: false

  account3:
    runs-on: ubuntu-latest
    name: login and lootify account3
    steps:
      - uses: elanthia-online/simu-rewards@v1
        with:
          account: ${{ secrets.ACCOUNT3 }}
          password: ${{ secrets.PASSWORD }}
          game: ${{ secrets.GAME_CODE }}
          bypass_login: false

  account4:
    runs-on: ubuntu-latest
    name: login and lootify account3
    steps:
      - uses: elanthia-online/simu-rewards@v1
        with:
          account: ${{ secrets.ACCOUNT4 }}
          password: ${{ secrets.PASSWORD }}
          game: ${{ secrets.GAME_CODE }}
          bypass_login: false
